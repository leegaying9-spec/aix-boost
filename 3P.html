<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>확인 및 보내기 - 말만해요</title>

  <style>
    :root { --bg:#f1f5f9; --primary:#2563eb; --secondary:#64748b; --text:#0f172a; --share:#10b981; }
    * { box-sizing:border-box; font-family:'Pretendard',system-ui,sans-serif; }
    body{ margin:0; background:var(--bg); display:flex; justify-content:center; min-height:100vh; opacity:0; transform:translateY(10px); transition:.4s ease; }
    body.page-show{ opacity:1; transform:translateY(0); }
    .container{ display:flex; flex-direction:column; width:100%; max-width:600px; background:#fff; min-height:100vh; }
    .topbar{ padding:15px 20px; border-bottom:2px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; background:#fff; }
    .topbar-title{ font-size:28px; font-weight:900; color:var(--primary); margin:0; }
    .help-btn{ background:#eff6ff; border:2px solid var(--primary); border-radius:12px; color:var(--primary); padding:6px 14px; font-size:16px; font-weight:900; cursor:pointer; }
    .help-panel{ display:none; background:#ecfeff; border-bottom:2px solid #bae6fd; padding:16px 20px; color:#0f172a; }
    .help-panel p{ margin:6px 0; font-size:16px; font-weight:800; line-height:1.5; }
    .stepper{ display:flex; justify-content:space-around; padding:15px; border-bottom:1px solid #f1f5f9; }
    .step{ display:flex; flex-direction:column; align-items:center; opacity:.3; font-size:14px; font-weight:bold; }
    .step.active{ opacity:1; color:var(--primary); }
    .step-icon{ width:30px; height:30px; border-radius:50%; background:#e2e8f0; display:grid; place-items:center; margin-bottom:5px; }
    .step.active .step-icon{ background:var(--primary); color:#fff; }

    .content{ padding:20px; flex:1; display:flex; flex-direction:column; }
    .guide-msg{ font-size:30px; font-weight:800; color:#1e293b; text-align:center; margin:10px 0 20px; }

    .previewBox{
      background:#f8fafc; border:3px solid #cbd5e1; border-radius:20px; padding:20px;
      width:100%; min-height:400px; margin-bottom:15px;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
    }

    .loading-wrap{ text-align:center; }
    .timer-text{ font-size:42px; font-weight:900; color:var(--primary); margin:15px 0; letter-spacing:-1px; }
    .loading-sub{ font-size:18px; color:var(--secondary); font-weight:600; }

    .result-wrap{ width:100%; display:none; }
    .result-text{
      font-size:24px; line-height:1.6; color:#1e293b; margin-bottom:20px; font-weight:700;
      background:#fff; padding:15px; border-radius:12px; border-left:5px solid var(--primary);
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      white-space:pre-wrap;
    }
    .result-img{
      width:100%; border-radius:12px; box-shadow:0 4px 12px rgba(0,0,0,.1);
      display:none; height:auto; max-width:100%;
    }

    .audio-controls{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:15px; }
    .audio-btn{ padding:18px; border-radius:12px; border:none; background:var(--primary); color:white; font-size:20px; font-weight:800; cursor:pointer; }
    .status-msg-box{ background:#f1f5f9; border-radius:15px; padding:15px; font-size:20px; font-weight:800; color:var(--primary); border:2px solid #e2e8f0; text-align:center; }
    .share-btn{ width:100%; height:85px; border-radius:20px; border:none; background:var(--share); color:white; font-size:26px; font-weight:900; cursor:pointer; margin-top:20px; transition:transform .1s; }
    .share-btn:active{ transform:scale(.98); }

    .nav-btns{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
    .nav-btn{ padding:18px; border-radius:18px; border:none; font-size:20px; font-weight:900; cursor:pointer; background:#94a3b8; color:#fff; }
    .nav-btn.home{ background:#64748b; }
    .nav-btn small{ display:block; font-size:12px; opacity:.9; margin-top:4px; }
  </style>
</head>

<body>
  <div class="container">
    <header class="topbar">
      <h1 class="topbar-title">말만해요</h1>
