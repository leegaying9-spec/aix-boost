<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <title>분석 중 - 말만해요</title>
    <style>
        body { margin:0; background:#f8fafc; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh; font-family:sans-serif; }
        .loader { border: 6px solid #f3f3f3; border-top: 6px solid #2563eb; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { color: #1e293b; font-weight: 800; }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>AI가 내용을 분석 중입니다...</h2>
    <p>잠시만 기다려 주세요.</p>

    <script>
        window.onload = () => {
            const data = localStorage.getItem('rawTranscript');
            if(!data) {
                alert("녹음된 데이터가 없습니다. 다시 시도해주세요.");
                location.href = "./home.html";
            } else {
                // ✅ 3P.html로 이동하여 카드뉴스 생성 시작
                setTimeout(() => { location.href = "./3P.html"; }, 1500);
            }
        };
    </script>
</body>
</html>
