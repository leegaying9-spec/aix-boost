<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>결과 확인</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .result-container { border: 1px solid #ccc; padding: 20px; display: inline-block; border-radius: 10px; }
        img { max-width: 100%; height: auto; border-radius: 10px; margin-top: 20px; }
        .loading { font-size: 1.2rem; color: #555; }
        .btn { padding: 10px 20px; margin-top: 20px; cursor: pointer; border: none; border-radius: 5px; background-color: #007bff; color: white; }
    </style>
</head>
<body>

    <h1>AI 생성 결과</h1>
    <div id="loading" class="loading">이미지와 게시글을 생성 중입니다. 잠시만 기다려주세요...</div>
    
    <div id="result" class="result-container" style="display:none;">
        <h2 id="title"></h2>
        <p id="content"></p>
        <p id="hashtags" style="color: blue;"></p>
        <div id="image-container"></div>
        <br>
        <button class="btn" onclick="location.href='home.html'">다시 만들기</button>
    </div>

    <script>
        window.onload = async function() {
            const transcript = localStorage.getItem('transcript');
            
            if (!transcript) {
                alert("녹음된 내용이 없습니다.");
                location.href = 'home.html';
                return;
            }

            try {
                // API 주소를 Vercel 환경에 맞춰 상대 경로로 수정
                const response = await fetch('/api/generate-post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ transcript })
                });

                const data = await response.json();

                if (data.ok) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('result').style.display = 'inline-block';

                    document.getElementById('title').innerText = data.post.title;
                    document.getElementById('content').innerText = data.post.content;
                    document.getElementById('hashtags').innerText = data.post.hashtags.join(' ');

                    if (data.image && data.image.data_url) {
                        const img = document.createElement('img');
                        img.src = data.image.data_url;
                        document.getElementById('image-container').appendChild(img);
                    }
                } else {
                    alert("생성 실패: " + data.error);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("서버 연결 오류가 발생했습니다.");
            }
        };
    </script>
</body>
</html>
