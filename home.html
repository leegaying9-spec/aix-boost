<script>

const finishRecording = () => {
  const textToSave = finalText.textContent.trim();
  if(!textToSave){
    speak("내용이 없습니다. 말씀하신 후 완료해주세요.");
    return;
  }
  
  // ✅ 1. 데이터 저장
  localStorage.setItem('rawTranscript', textToSave);
  
  // ✅ 2. 다음 단계로 이동
  speak("녹음 완료되었습니다.", () => {
    document.body.classList.remove("page-show");
    setTimeout(() => { location.href = "./2P.html"; }, 400);
  });
};

// ... (중략: 단축키 등 기존 로직) ...
</script>
