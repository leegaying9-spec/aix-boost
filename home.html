<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
<title>말하기 - 말만해요</title>

<style>
:root { 
    --bg:#f8fafc; --primary:#2563eb; --danger:#dc2626;
    --success:#10b981; --warning:#f59e0b; --text:#0f172a;
}
* { box-sizing:border-box; font-family:'Pretendard',system-ui,sans-serif; }

body {
    margin: 0; background: var(--bg);
    display: flex; justify-content: center; min-height: 100vh;
    opacity: 0; transform: translateY(10px); 
    transition: opacity 0.4s ease, transform 0.4s ease;
}
body.page-show { opacity: 1; transform: translateY(0); }

.container{ width:100%; max-width:480px; background:#fff; min-height:100vh; display:flex; flex-direction:column; }

.topbar{ padding:16px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid #f1f5f9; }
.topbar-title{ font-size:26px; font-weight:900; color:var(--primary); }
.help-btn { background: #eff6ff; border: 2px solid var(--primary); border-radius: 12px; color: var(--primary); padding: 8px 16px; font-size: 18px; font-weight: 800; cursor: pointer; }

.help-panel{ display:none; background:#fffbeb; border-bottom:2px solid #fef3c7; padding:20px; }
.help-panel ul{ margin:0; padding:0; list-style:none; font-size:20px; line-height:1.8; color:#451a03; font-weight: 700; }
.help-panel li{ margin-bottom:10px; }

.stepper{ display:flex; justify-content:space-around; padding:14px; border-bottom:1px solid #f1f5f9; }
.step{ display:flex; flex-direction:column; align-items:center; font-size:18px; font-weight:800; opacity:.3; }
.step.active{ opacity:1; color:var(--primary); }
.step-icon{ width:40px; height:40px; border-radius:50%; background:#e2e8f0; display:grid; place-items:center; margin-bottom:4px; }
.step.active .step-icon{ background:var(--primary); color:#fff; }

.content{ padding:20px; flex:1; text-align:center; display:flex; flex-direction:column; justify-content: center; }

.guide-msg{ font-size:30px; font-weight:900; margin-bottom: 2px; }

.sub-guide { line-height: 1.1; margin-bottom: 20px; }
.sub-guide b { display: block; margin: 0; padding: 0; }

.transcript-box{
    display: none; background:#f8fafc; border:3px solid #cbd5e1; border-radius:18px;
    min-height:200px; padding:22px; text-align:left; font-size:26px; font-weight:700; 
    margin-bottom:18px; line-height: 1.6; animation: fadeIn 0.3s ease-in;
    max-height:300px; overflow-y:auto;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.mic-wrap{ display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:20px; }
.mic-btn{
    width:150px; height:150px; border-radius:50%; background:var(--danger);
    border:10px solid #fee2e2; cursor:pointer; display:grid; place-items:center;
    transition: transform 0.1s;
}
.mic-btn:active { transform: scale(0.95); }
.mic-btn.recording{ animation:pulse 1.5s infinite; }
.mic-btn.paused{ background:#94a3b8; border-color:#e2e8f0; }
@keyframes pulse{ 0%{ transform:scale(1); } 50%{ transform:scale(1.05); } 100%{ transform:scale(1); } }
.mic-btn svg{ width:64px; height:64px; fill:#fff; }

.timer{ font-size:34px; font-weight:900; color:var(--danger); }

.btn-group{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.btn{ padding:20px; border-radius:16px; border:none; font-size:22px; font-weight:800; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:6px; transition: opacity 0.2s; }
.btn:active { opacity: 0.8; }
.btn-pause{ background:#2563eb; color:#fff; }
.btn-redo{ background:var(--warning); color:#fff; }
.btn-finish{ grid-column:span 2; background:var(--success); color:#fff; font-size:28px; padding:24px; }
.btn small{ font-size:16px; opacity:.9; background:rgba(0,0,0,.1); padding:2px 8px; border-radius:6px; }
</style>
</head>

<body>
<div class="container">
<header class="topbar">
  <div class="topbar-title">말만해요</div>
  <button class="help-btn" id="helpBtn">도움말 ▾</button>
</header>

<div class="help-panel" id="helpPanel">
  <ul>
    <li>1. <b style="color:#dc2626">빨간 마이크</b>를 누르고 말씀하세요.</li>
    <li>2. <b style="color:#2563eb">일시정지(Space)</b>로 잠시 멈출 수 있어요.</li>
    <li>3. <b style="color:#f59e0b">재녹음(R)</b>으로 다시 말할 수 있어요.</li>
    <li>4. <b style="color:#10b981">녹음완료(Enter)</b> 후 다음 단계로 이동해요.</li>
  </ul>
</div>

<nav class="stepper">
  <div class="step active"><div class="step-icon">1</div>말하기</div>
  <div class="step"><div class="step-icon">2</div>선택</div>
  <div class="step"><div class="step-icon">3</div>확인/보내기</div>
</nav>

<main class="content">
  <div class="guide-msg">지금 바로 말씀해 보세요</div>
  <div class="sub-guide">
    <b style="color:#db22bc; font-size:20px;">간단한 자기소개 후 내용을 말씀하세요</b>
    <b style="color:#10b981; font-size:18px;">(예 : 자연대 청소부입니다.)</b>
  </div>

  <div class="transcript-box" id="transcriptBox">
    <span id="finalText"></span>
    <span id="interimText" style="color:var(--primary);opacity:.7;"></span>
    <div id="placeholder" style="color:#cbd5e1; display:none;">글자가 여기에 나옵니다.</div>
  </div>

  <div class="mic-wrap">
    <button class="mic-btn" id="micBtn">
      <svg viewBox="0 0 24 24">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
      </svg>
    </button>
    <div class="timer" id="recordTimer">00:00</div>
  </div>

  <div class="btn-group">
    <button class="btn btn-pause" id="pauseBtn"><div><span id="pauseIcon">⏸</span> <span id="pauseTxt">일시정지</span></div><small>Space</small></button>
    <button class="btn btn-redo" id="redoBtn"><div>↻ 재녹음</div><small>R</small></button>
    <button class="btn btn-finish" id="finishBtn"><div>✅ 녹음완료</div><small>Enter</small></button>
  </div>
</main>
</div>

<script>
let isNavigating = false;
let isSpeakingGuidance = false; 

const micBtn = document.getElementById('micBtn');
const pauseBtn = document.getElementById('pauseBtn');
const pauseTxt = document.getElementById('pauseTxt');
const pauseIcon = document.getElementById('pauseIcon');
const finalText = document.getElementById('finalText');
const interimText = document.getElementById('interimText');
const placeholder = document.getElementById('placeholder');
const recordTimer = document.getElementById('recordTimer');
const transcriptBox = document.getElementById('transcriptBox');

let recognition, isRecording=false, isPaused=false, timerInterval, seconds=0;

function speak(msg, cb){ 
  window.speechSynthesis.cancel(); 
  isSpeakingGuidance = true; 
  const u = new SpeechSynthesisUtterance(msg); 
  u.lang = "ko-KR"; 
  u.onend = () => {
    isSpeakingGuidance = false; 
    if(cb) cb();
  };
  window.speechSynthesis.speak(u); 
}

function initRecognition() {
    if (!('webkitSpeechRecognition' in window)) {
        alert("이 브라우저는 음성 인식을 지원하지 않습니다. 크롬을 사용해주세요.");
        return;
    }
    recognition = new webkitSpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.lang = 'ko-KR';

    recognition.onresult = (e) => {
        if(isSpeakingGuidance) return;
        transcriptBox.style.display = 'block';
        let interim = '';
        for(let i = e.resultIndex; i < e.results.length; i++){
            if(e.results[i].isFinal){
                finalText.textContent += e.results[i][0].transcript + ' ';
                transcriptBox.scrollTop = transcriptBox.scrollHeight;
            } else {
                interim += e.results[i][0].transcript;
            }
        }
        interimText.textContent = interim;
    };

    recognition.onend = () => {
        if(isRecording && !isPaused) {
            try { recognition.start(); } catch(err) {}
        }
    };
}

function startRecording(){
  isRecording = true; 
  isPaused = false;
  micBtn.classList.add('recording'); 
  micBtn.classList.remove('paused');
  pauseTxt.textContent = "일시정지"; 
  pauseIcon.textContent = "⏸";
  try { recognition.start(); } catch(e) {}
  startTimer();
}

function togglePause(){
  if(!isRecording){
    startRecording();
    speak("녹음을 시작합니다.");
  } else {
    if(!isPaused){
      isPaused = true;
      micBtn.classList.add('paused'); 
      micBtn.classList.remove('recording');
      pauseTxt.textContent = "재개하기"; 
      pauseIcon.textContent = "▶";
      try { recognition.stop(); } catch(e) {}
      clearInterval(timerInterval);
      speak("잠시 멈췄습니다.");
    } else {
      isPaused = false;
      micBtn.classList.remove('paused'); 
      micBtn.classList.add('recording');
      pauseTxt.textContent = "일시정지"; 
      pauseIcon.textContent = "⏸";
      try { recognition.start(); } catch(e) {}
      startTimer();
      speak("다시 시작합니다.");
    }
  }
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(() => { seconds++; updateTimerDisplay(); }, 1000);
}

function updateTimerDisplay(){
  const m = String(Math.floor(seconds/60)).padStart(2, '0');
  const s = String(seconds%60).padStart(2, '0');
  recordTimer.textContent = `${m}:${s}`;
}

function resetAll(callback){
  isRecording = false; 
  isPaused = false; 
  seconds = 0;
  clearInterval(timerInterval);
  updateTimerDisplay();
  
  finalText.textContent = ""; 
  interimText.textContent = "";
  transcriptBox.style.display = 'none';
  micBtn.classList.remove('recording', 'paused');
  pauseTxt.textContent = "일시정지"; 
  pauseIcon.textContent = "⏸";
  
  if (recognition) {
    recognition.onend = null; 
    recognition.stop();
  }
  
  setTimeout(() => {
    initRecognition(); 
    if(callback) callback(); 
  }, 500);
}

document.getElementById('redoBtn').onclick = () => {
  window.speechSynthesis.cancel(); 
  speak("처음부터 다시 녹음합니다.", () => {
    resetAll(() => { 
        startRecording(); 
    });
  });
};

micBtn.onclick = togglePause;
pauseBtn.onclick = togglePause;

const finishRecording = () => {
  if(isNavigating) return;
  
  if(!finalText.textContent.trim()){
    speak("내용이 없습니다. 말씀하신 후 완료해주세요.");
    return;
  }
  
  isNavigating = true;
  clearInterval(timerInterval);
  isRecording = false;
  
  micBtn.classList.remove('recording'); 
  micBtn.classList.add('paused'); 
  
  try { recognition.stop(); } catch(e) {}

  speak("녹음 완료되었습니다.", () => {
    localStorage.setItem('rawTranscript', finalText.textContent.trim());
    document.body.classList.remove("page-show");
    // ✅ 다음 단계인 2P.html로 이동
    setTimeout(() => location.href = "2P.html", 400);
  });
};

document.getElementById('finishBtn').onclick = finishRecording;

window.onkeydown = (e) => {
  if(e.key === "Enter"){ e.preventDefault(); finishRecording(); }
  if(e.code === "Space"){ e.preventDefault(); togglePause(); }
  if(e.key.toLowerCase() === "r"){ 
    e.preventDefault(); 
    document.getElementById('redoBtn').click(); 
  }

  // ✅ 단축키 맵 수정 (0: 소개, 1: 현재페이지)
  const altMap = { 
    "0":"index.html", // 구 preview.html
    "1":"home.html",  // 현재 페이지
    "2":"2P.html", 
    "3":"3P.html", 
    "4":"sns.html" 
  };
  if(e.altKey && altMap[e.key]){
    if(isNavigating) return; 
    isNavigating = true;       
    e.preventDefault();
    window.speechSynthesis.cancel();
    document.body.classList.remove("page-show");
    setTimeout(() => location.href = altMap[e.key], 400);
  }
};

window.onload = () => {
  initRecognition();
  setTimeout(() => document.body.classList.add("page-show"), 100);
  speak("말하기 단계입니다. 빨간 버튼을 누르고 말씀하세요.");
};

const helpBtn = document.getElementById("helpBtn");
const helpPanel = document.getElementById("helpPanel");
let helpOpen = false;
helpBtn.onclick = () => {
  helpOpen = !helpOpen;
  helpPanel.style.display = helpOpen ? "block" : "none";
  helpBtn.textContent = helpOpen ? "도움말 ▴" : "도움말 ▾";
};
</script>
</body>
</html>
