<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>분석 중 - 말만해요</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f8fafc; }
        .loader { border: 8px solid #f3f3f3; border-top: 8px solid #2563eb; border-radius: 50%; width: 60px; height: 60px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>
    <h2>AI가 내용을 분석하고 있습니다...</h2>
    <p>잠시만 기다려 주세요.</p>

    <script>
        window.onload = function() {
            // ✅ 데이터 읽기 시도
            const savedData = localStorage.getItem('rawTranscript');

            if (!savedData || savedData.trim() === "") {
                alert("녹음된 내용을 찾을 수 없습니다. 다시 말씀해 주세요.");
                location.href = "./home.html";
                return;
            }

            // 분석 로직으로 전달 (예: 3P.html로 이동하며 데이터 전달)
            setTimeout(() => {
                location.href = "./3P.html";
            }, 1500);
        };
    </script>
</body>
</html>
