<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>선택 - 말만해요</title>
  <style>
    :root { --bg: #f8fafc; --primary: #2563eb; --secondary: #64748b; --black: #000000; --success: #10b981; }
    * { box-sizing: border-box; font-family: 'Pretendard', system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); display: flex; justify-content: center; min-height: 100vh; opacity: 0; transform: translateY(10px); transition: 0.4s ease; }
    body.page-show { opacity: 1; transform: translateY(0); }
    .container { width: 100%; max-width: 500px; background: #fff; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); overflow-x: hidden; }
    .topbar { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; }
    .topbar-title { font-size: 26px; font-weight: 900; color: var(--primary); }
    .help-btn { background: #eff6ff; border: 2px solid var(--primary); border-radius: 12px; color: var(--primary); padding: 5px 12px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .help-panel { display: none; background: #f0f9ff; border-bottom: 2px solid #bae6fd; padding: 20px; color: #1e293b; }
    .help-panel p { margin: 8px 0; font-size: 18px; font-weight: 700; line-height: 1.5; }
    .stepper { display: flex; justify-content: space-around; padding: 15px 10px; border-bottom: 1px solid #f1f5f9; }
    .step { display: flex; flex-direction: column; align-items: center; opacity: 0.3; font-size: 16px; font-weight: 800; }
    .step.active { opacity: 1; color: var(--primary); }
    .step-icon { width: 35px; height: 35px; border-radius: 50%; background: #e2e8f0; display: grid; place-items: center; margin-bottom: 5px; font-size: 18px; }
    .step.active .step-icon { background: var(--primary); color: #fff; }
    .content { padding: 15px 20px; flex: 1; display: flex; flex-direction: column; }
    .main-title { font-size: 28px; font-weight: 900; text-align: center; margin-bottom: 20px; }
    .section-title { font-size: 20px; font-weight: 800; color: #334155; margin: 15px 0 10px 0; }
    .tone-grid, .type-grid { display: grid; gap: 12px; margin-bottom: 10px; }
    .tone-grid { grid-template-columns: 1fr 1fr 1fr; }
    .type-grid { grid-template-columns: 1fr 1fr; }
    .opt-btn { background: #fff; border: 3px solid #e2e8f0; border-radius: 20px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.2s ease; padding: 20px 10px; min-height: 135px; }
    .opt-btn.active { border-color: var(--primary); background: #eff6ff; box-shadow: 0 0 0 1px var(--primary) inset; }
    .opt-label { font-size: 24px; font-weight: 900; color: var(--black); margin: 8px 0; }
    .opt-num { font-size: 18px; background: #f1f5f9; color: #475569; padding: 4px 18px; border-radius: 12px; font-weight: 800; }
    .opt-btn.active .opt-num { background: var(--primary); color: #fff; }
    .status-bar { width: 100%; padding: 18px; border-radius: 20px; border: 2px solid #e2e8f0; background: #eff6ff; color: var(--primary); font-size: 26px; font-weight: 900; text-align: center; margin: 10px 0 20px 0; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn { padding: 20px; border-radius: 20px; border: none; font-size: 22px; font-weight: 900; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .btn-back { background: #94a3b8; color: white; }
    .btn-home { background: #64748b; color: white; }
    .btn-next { background: var(--success); color: white; grid-column: span 2; padding: 25px; font-size: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar"><div class="topbar-title">말만해요</div><button class="help-btn" id="helpBtn">도움말 ▾</button></header>
    <div class="help-panel" id="helpPanel"><p>말투와 형식을 선택하세요.</p></div>
    <nav class="stepper">
      <div class="step"><div class="step-icon">1</div>말하기</div>
      <div class="step active"><div class="step-icon">2</div>선택</div>
      <div class="step"><div class="step-icon">3</div>확인/보내기</div>
    </nav>
    <main class="content">
      <div class="main-title">원하는 스타일을 선택하세요</div>
      <div class="section-title">📢 말투를 골라보세요</div>
      <div class="tone-grid">
        <button class="opt-btn" id="tone1" data-value="친근한"><span>😊</span><span class="opt-label">친근한</span><span class="opt-num">1번</span></button>
        <button class="opt-btn" id="tone2" data-value="공식적"><span>📄</span><span class="opt-label">공식적</span><span class="opt-num">2번</span></button>
        <button class="opt-btn" id="tone3" data-value="정보형"><span>🖊️</span><span class="opt-label">정보형</span><span class="opt-num">3번</span></button>
      </div>
      <div class="section-title">⚙️ 형식을 골라보세요</div>
      <div class="type-grid">
        <button class="opt-btn" id="type4" data-value="글자"><span class="opt-label">Aa 글자</span><span class="opt-num">4번</span></button>
        <button class="opt-btn" id="type5" data-value="이미지"><span class="opt-label">🖼️ 이미지</span><span class="opt-num">5번</span></button>
      </div>
      <div class="status-bar" id="statusBar">아직 고르지 않았습니다</div>
      <div class="btn-group">
        <button class="btn btn-back" id="backBtn" onclick="location.href='home.html'">⬅ 이전(Backspace)</button>
        <button class="btn btn-home" id="homeBtn" onclick="location.href='index.html'">🏠 처음으로(H)</button>
        <button class="btn btn-next" id="nextBtn">다음 단계로(Enter) ✅</button>
      </div>
    </main>
  </div>

  <script>
    let selTone = "";
    let selType = "";

    function speak(msg) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(msg);
      u.lang = "ko-KR";
      window.speechSynthesis.speak(u);
    }

    document.querySelectorAll('.tone-grid .opt-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tone-grid .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selTone = btn.getAttribute('data-value');
        speak(selTone + " 말투를 선택했습니다.");
        updateStatus();
      };
    });

    document.querySelectorAll('.type-grid .opt-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.type-grid .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selType = btn.getAttribute('data-value');
        speak(selType + " 형식을 선택했습니다.");
        updateStatus();
      };
    });

    function updateStatus() {
      document.getElementById('statusBar').innerText = (selTone || "?") + " / " + (selType || "?");
    }

    function handleNext() {
      if (!selTone || !selType) {
        speak("말투와 형식을 모두 선택해 주세요.");
        return alert("모두 선택해 주세요.");
      }
      localStorage.setItem("selectedTone", selTone);
      localStorage.setItem("selectedType", selType);
      
      // 기존 생성 데이터 초기화
      localStorage.removeItem("generatedPost");
      localStorage.removeItem("generatedImage");
      localStorage.removeItem("generatedType");
      
      location.href = "3P.html";
    }

    document.getElementById('nextBtn').onclick = handleNext;

    window.onload = () => {
      document.body.classList.add("page-show");
      speak("말투와 형식을 선택하는 단계입니다. 버튼을 누르거나 숫자를 눌러 선택하세요.");
    };

    const helpBtn = document.getElementById("helpBtn");
    const helpPanel = document.getElementById("helpPanel");
    let helpOpen = false;
    helpBtn.onclick = () => {
      helpOpen = !helpOpen;
      helpPanel.style.display = helpOpen ? "block" : "none";
      helpBtn.textContent = helpOpen ? "도움말 ▴" : "도움말 ▾";
    };

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();

      // 1. Alt 조합키 (수정된 파일명 반영)
      if (e.altKey) {
        e.preventDefault();
        const altMap = { 
            "0":"index.html", // 소개
            "1":"home.html",  // 말하기
            "2":"2P.html", 
            "3":"3P.html", 
            "4":"sns.html" 
        };
        if (altMap[e.key]) location.href = altMap[e.key];
        return;
      }

      // 2. 단일 단축키
      if (key === "backspace") {
        e.preventDefault();
        location.href = "home.html";
      } else if (key === "h") {
        location.href = "index.html";
      } else if (key === "enter") {
        handleNext();
      } else if (["1", "2", "3"].includes(key)) {
        document.getElementById("tone" + key).click();
      } else if (["4", "5"].includes(key)) {
        document.getElementById("type" + key).click();
      }
    });
  </script>
</body>
</html>
